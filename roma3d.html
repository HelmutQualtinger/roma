<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const S = window.SCENE;
const [LAT0, LON0] = S.origin;
const KX = 111320 * Math.cos(41.8902 * Math.PI / 180), KY = 110574;
const ll = (lat, lon) => [(lon - LON0) * KX, (lat - LAT0) * KY];

// deterministic random
let seed = 12345;
const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

// ---------- renderer / scene ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);
const ANISO = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();
const sky = document.createElement('canvas'); sky.width = 2; sky.height = 256;
{ const g = sky.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, '#7fa7d1'); gr.addColorStop(0.55, '#bcd0e2'); gr.addColorStop(1, '#e4e6e2');
  g.fillStyle = gr; g.fillRect(0, 0, 2, 256); }
scene.background = new THREE.CanvasTexture(sky); scene.background.colorSpace = THREE.SRGBColorSpace;
scene.fog = new THREE.Fog(0xdde3e6, 2200, 6500);

const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 3, 9000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.maxPolarAngle = THREE.MathUtils.degToRad(125);   // past 90° the camera looks up into the sky; the main loop keeps it above ground
controls.minDistance = 25; controls.maxDistance = 5000; controls.autoRotateSpeed = 0.6;

const hemi = new THREE.HemisphereLight(0xe3edff, 0x8f8068, 1.25);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff0da, 2.7);
sun.position.set(-650, 900, 750);
sun.castShadow = true;
sun.shadow.bias = -0.0003;
scene.add(sun, sun.target);
// Shadows: the city is static, so the overview shadow map is rendered once (8K over the whole 2.3 km).
// During the ride a 4K map over ±220 m follows the rider (≈11 cm per texel) and is snapped to the
// texel grid so the shadow edges do not shimmer while moving.
renderer.shadowMap.autoUpdate = false;
const SUN_DIR = sun.position.clone().normalize();
const L_F = SUN_DIR.clone().negate(), L_R = new THREE.Vector3().crossVectors(L_F, new THREE.Vector3(0, 1, 0)).normalize(), L_U = new THREE.Vector3().crossVectors(L_R, L_F);
const SHADOW = {
  overview: { size: Math.min(8192, renderer.capabilities.maxTextureSize), half: 1150, dist: 1600, depth: 1600, normalBias: 0.5 },
  ride: { size: 4096, half: 220, dist: 900, depth: 450, normalBias: 0.08 },
};
let shadowMode = null;
function setShadow(mode, center = new THREE.Vector3()) {
  const m = SHADOW[mode], cam = sun.shadow.camera;
  if (shadowMode !== mode) {
    if (sun.shadow.mapSize.x !== m.size) { sun.shadow.map?.dispose(); sun.shadow.map = null; sun.shadow.mapSize.set(m.size, m.size); }
    Object.assign(cam, { left: -m.half, right: m.half, top: m.half, bottom: -m.half, near: m.dist - m.depth, far: m.dist + m.depth });
    cam.updateProjectionMatrix(); sun.shadow.normalBias = m.normalBias; shadowMode = mode;
  }
  const texel = 2 * m.half / m.size, c = center.clone();
  const a = c.dot(L_R), b = c.dot(L_U);
  c.addScaledVector(L_R, Math.round(a / texel) * texel - a).addScaledVector(L_U, Math.round(b / texel) * texel - b);
  sun.target.position.copy(c); sun.position.copy(c).addScaledVector(SUN_DIR, m.dist);
  sun.target.updateMatrixWorld(); sun.updateMatrixWorld();
  renderer.shadowMap.needsUpdate = true;
}
setShadow('overview');

// ---------- textures ----------
function tex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = ANISO; t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
function speckle(g, w, h, n, a) {
  for (let i = 0; i < n; i++) {
    g.fillStyle = rnd() < 0.5 ? `rgba(0,0,0,${a * rnd()})` : `rgba(255,255,255,${a * rnd()})`;
    g.fillRect(rnd() * w, rnd() * h, 1 + rnd() * 3, 1 + rnd() * 3);
  }
}

// residential facade: 4 x 4 window bays (3.4 m x 3.5 m each)
const winTex = tex(512, 512, (g, w, h) => {
  g.fillStyle = '#fff'; g.fillRect(0, 0, w, h); speckle(g, w, h, 5000, 0.07);
  for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) {
    const x = c * 128, y = r * 128;
    g.fillStyle = 'rgba(0,0,0,.10)'; g.fillRect(x, y + 123, 128, 5);
    g.fillStyle = 'rgba(0,0,0,.16)'; g.fillRect(x + 35, y + 20, 58, 88);
    const t = rnd();
    if (t < 0.42) {
      g.fillStyle = ['#43573e', '#5a4632', '#58615a', '#3c4d3a'][Math.floor(rnd() * 4)];
      g.fillRect(x + 40, y + 25, 48, 78);
      g.fillStyle = 'rgba(0,0,0,.28)';
      for (let s = y + 28; s < y + 101; s += 5) g.fillRect(x + 40, s, 48, 1.5);
      g.fillRect(x + 63, y + 25, 2, 78);
    } else {
      g.fillStyle = '#1e2730'; g.fillRect(x + 40, y + 25, 48, 78);
      g.fillStyle = 'rgba(160,185,205,.35)'; g.fillRect(x + 42, y + 27, 20, 35);
      g.fillStyle = '#d8d4cc'; g.fillRect(x + 63, y + 25, 2, 78); g.fillRect(x + 40, y + 60, 48, 2);
      if (t < 0.8) { g.fillStyle = '#44583f'; g.fillRect(x + 27, y + 25, 12, 78); g.fillRect(x + 89, y + 25, 12, 78); }
    }
    g.fillStyle = 'rgba(0,0,0,.3)'; g.fillRect(x + 33, y + 104, 62, 4);
    if (rnd() < 0.18) { g.fillStyle = 'rgba(30,30,30,.75)'; g.fillRect(x + 30, y + 92, 68, 3); for (let s = x + 31; s < x + 98; s += 5) g.fillRect(s, y + 92, 1.5, 14); }
  }
});
// ground floor: shops / portals, 4 x 4.5 m, 4.2 m high
const shopTex = tex(512, 128, (g, w, h) => {
  g.fillStyle = '#fff'; g.fillRect(0, 0, w, h); speckle(g, w, h, 1500, 0.08);
  g.fillStyle = 'rgba(0,0,0,.18)'; g.fillRect(0, 0, w, 6);
  for (let c = 0; c < 4; c++) {
    const x = c * 128, t = rnd();
    g.fillStyle = 'rgba(0,0,0,.14)'; g.fillRect(x + 18, 22, 92, 106);
    g.fillStyle = t < 0.5 ? '#2a2723' : t < 0.8 ? '#3b2f26' : '#4a4f52';
    g.beginPath(); g.moveTo(x + 24, 128); g.lineTo(x + 24, 52); g.arc(x + 64, 52, 40, Math.PI, 2 * Math.PI); g.lineTo(x + 104, 128); g.fill();
    if (t < 0.5) { g.fillStyle = 'rgba(190,200,205,.25)'; g.fillRect(x + 30, 60, 30, 60); }
    if (t > 0.85) { g.fillStyle = ['#7d2f27', '#2f4d3d', '#3a3f5c'][c % 3]; g.fillRect(x + 14, 26, 100, 10); }
  }
  g.fillStyle = 'rgba(0,0,0,.22)'; g.fillRect(0, h - 10, w, 10);
});
// ancient masonry: brick + travertine blocks, 6 x 6 m
const stoneTex = tex(256, 256, (g, w, h) => {
  g.fillStyle = '#fff'; g.fillRect(0, 0, w, h);
  for (let y = 0; y < h; y += 6) for (let x = (y / 6) % 2 * 9; x < w; x += 18) {
    g.fillStyle = `rgba(${rnd() < .5 ? '0,0,0' : '255,255,255'},${0.04 + rnd() * 0.1})`; g.fillRect(x, y, 17, 5);
  }
  g.fillStyle = 'rgba(0,0,0,.12)'; for (let y = 0; y < h; y += 6) g.fillRect(0, y + 5, w, 1);
  for (let i = 0; i < 25; i++) { g.fillStyle = `rgba(0,0,0,${0.05 + rnd() * 0.12})`; g.beginPath(); g.ellipse(rnd() * w, rnd() * h, 6 + rnd() * 30, 4 + rnd() * 16, 0, 0, 7); g.fill(); }
  speckle(g, w, h, 3000, 0.1);
});
// monumental facade (churches, palazzi): 8 x 16 m tile
const monoTex = tex(256, 512, (g, w, h) => {
  g.fillStyle = '#fff'; g.fillRect(0, 0, w, h); speckle(g, w, h, 3000, 0.05);
  g.fillStyle = 'rgba(0,0,0,.10)'; g.fillRect(0, 0, 20, h); g.fillRect(236, 0, 20, h);
  g.fillStyle = 'rgba(0,0,0,.14)'; g.fillRect(0, 250, w, 10); g.fillRect(0, 0, w, 8);
  for (const y0 of [60, 310]) {
    g.fillStyle = 'rgba(0,0,0,.16)'; g.fillRect(82, y0 - 8, 92, 160);
    g.fillStyle = '#24282c'; g.beginPath(); g.moveTo(90, y0 + 145); g.lineTo(90, y0 + 38); g.arc(128, y0 + 38, 38, Math.PI, 2 * Math.PI); g.lineTo(166, y0 + 145); g.fill();
    g.fillStyle = 'rgba(0,0,0,.3)'; g.fillRect(80, y0 + 148, 96, 5);
  }
});
// Colosseum arcade: one bay (7 m wide) over the full 48.5 m height
const colTex = tex(256, 1024, (g, w, h) => {
  const Y = m => h - m * h / 48.5, X = m => m * w / 7;
  g.fillStyle = '#ddd0b2'; g.fillRect(0, 0, w, h);
